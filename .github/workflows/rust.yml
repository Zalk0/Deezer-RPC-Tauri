name: Rust build
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runners:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runners }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
