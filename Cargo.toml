[package]
name = "deezer-rpc-tauri"
version = "0.0.1"
description = "A simple Deezer app providing Discord RPC"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
discord-rich-presence = "1.1.0"
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes performance.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
